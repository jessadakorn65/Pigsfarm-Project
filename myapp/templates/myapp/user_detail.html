<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียดผู้ใช้</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <div class="max-w-3xl mx-auto mt-10 bg-white shadow-lg rounded-lg p-8">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">รายละเอียดผู้ใช้</h2>

        <div class="border-b pb-6 mb-6">
            <p class="text-xl text-gray-700"><strong class="font-semibold">ชื่อผู้ใช้:</strong> {{ user.username }}</p>
            <p class="text-xl text-gray-700"><strong class="font-semibold">อีเมล:</strong> {{ user.email }}</p>
            <p class="text-xl text-gray-700"><strong class="font-semibold">บทบาท:</strong> {{ user.get_role_display }}</p>
            <p class="text-xl text-gray-700"><strong class="font-semibold">เลขบัตรประชาชน:</strong> {{ user.id_card }}</p>
            <p class="text-xl text-gray-700"><strong class="font-semibold">เบอร์โทร:</strong> {{ user.phone_number }}</p>
        </div>

        <div class="mt-8 text-center">
            <a href="{% url 'boss_dashboard' %}" class="bg-indigo-600 text-white px-6 py-3 rounded-full shadow-lg hover:bg-indigo-800 transition duration-300">
                🔙 กลับไปแดชบอร์ด
            </a>
        </div>
    </div>

</body>
</html>
