<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <form method="POST" action="{% url 'check_heat_status' pig.pig_id %}" class="flex justify-center items-center min-h-screen bg-gray-100">
        {% csrf_token %}
        
        <div class="bg-white shadow-xl rounded-lg p-8 w-96 relative">
            <!-- ปุ่มย้อนกลับ (กากบาทสีแดง) -->
            <a href="{% url 'pig_list' %}" class="absolute top-4 right-4 text-red-500 hover:text-red-700 text-xl">
                <i class="fa-solid fa-xmark"></i> <!-- ไอคอนกากบาท -->
            </a>
    
            <h2 class="text-center text-2xl font-bold text-gray-700 mb-6">ตรวจสอบการผสม</h2>
            
            <!-- อวัยวะเพศบวมไหม? -->
            <div class="mb-6 flex justify-between items-center">
                <label class="text-gray-700 text-lg flex items-center">
                    <i class="fa-solid fa-heart mr-2 text-teal-500"></i> อวัยวะเพศบวมไหม?
                </label>
                <!-- ช่องติ๊ก "ใช่" และ "ไม่ใช่" -->
                <div class="flex space-x-6">
                    <label class="flex items-center">
                        <input type="radio" name="is_genital_swollen" value="yes" class="form-radio h-5 w-5 text-teal-500">
                        <span class="ml-2 text-gray-700">ใช่</span>
                    </label>
                    <label class="flex items-center">
                        <input type="radio" name="is_genital_swollen" value="no" class="form-radio h-5 w-5 text-teal-500">
                        <span class="ml-2 text-gray-700">ไม่ใช่</span>
                    </label>
                </div>
            </div>
    
            <!-- ขี่หลังแล้วมีอาการฮีสติดสัดไหม? -->
            <div class="mb-6 flex justify-between items-center">
                <label class="text-gray-700 text-lg flex items-center">
                    <i class="fa-solid fa-sync-alt mr-2 text-teal-500"></i> ขี่หลังแล้วมีอาการฮีสติดสัดไหม?
                </label>
                <!-- ช่องติ๊ก "ใช่" และ "ไม่ใช่" -->
                <div class="flex space-x-6">
                    <label class="flex items-center">
                        <input type="radio" name="is_in_heat" value="yes" class="form-radio h-5 w-5 text-teal-500">
                        <span class="ml-2 text-gray-700">ใช่</span>
                    </label>
                    <label class="flex items-center">
                        <input type="radio" name="is_in_heat" value="no" class="form-radio h-5 w-5 text-teal-500">
                        <span class="ml-2 text-gray-700">ไม่ใช่</span>
                    </label>
                </div>
            </div>
    
            <!-- ปุ่มยืนยัน -->
            <div class="flex justify-center">
                <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white px-6 py-2 rounded-lg w-full flex justify-center items-center">
                    <i class="fa-solid fa-check-circle mr-2"></i> ยืนยัน
                </button>
            </div>
        </div>
    </form>
    
</body>
</html>
