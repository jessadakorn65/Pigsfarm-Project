<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>ART</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="font-sans bg-gray-100">

<header class="bg-white p-4 flex justify-between items-center shadow-md">
    <div class="flex items-center space-x-3">
        <img src="https://i.ibb.co/qkThxX8/logo.png" alt="logo" class="h-10">
        <span class="text-xl font-semibold">ART</span>
    </div>
    <div class="flex items-center space-x-5">
        <div class="relative">
            <button class="flex items-center space-x-2 cursor-pointer">
                <i class="fa-solid fa-chevron-down"></i>
            </button>
            <ul class="absolute right-0 hidden mt-2 bg-white shadow-lg rounded-md w-48 text-gray-800">
                <li><a href="#" class="block px-4 py-2 hover:bg-teal-500">Home</a></li>
                <li><a href="#" class="block px-4 py-2 hover:bg-teal-500">Blog</a></li>
                <li><a href="#" class="block px-4 py-2 hover:bg-teal-500">Contact</a></li>
                <li><a href="#" class="block px-4 py-2 hover:bg-teal-500">Other</a></li>
                <li><a href="#" class="block px-4 py-2 hover:bg-teal-500">Photo</a></li>
            </ul>
        </div>
    </div>
</header>

<div class="flex">
    <nav class="bg-gray-800 text-white w-64 p-4 h-screen">
        <ul class="space-y-3">
            <li><a href="{% url 'boss_dashboard' %}" class="flex items-center space-x-3 py-3 hover:bg-teal-500"><i class="fa-solid fa-circle"></i><span>Dashboard</span></a></li>
            <li><a href="{% url 'add_pig' %}" class="flex items-center space-x-3 py-3 hover:bg-teal-500"><i class="fa-solid fa-bars"></i><span>เพิ่มข้อมูลสุกร</span></a></li>
            <li><a href=" #" class="flex items-center space-x-3 py-3 hover:bg-teal-500"><i class="fa-solid fa-cogs"></i><span> </span>โปรไฟล์</a></li>
            <li><a href="{% url 'pig_list' %}" class="flex items-center space-x-3 py-3 hover:bg-teal-500"><i class="fa-solid fa-book"></i><span>บันทึกรายการสุกรในฟาร์ม</span></a></li>
            <li><a href="#" class="flex items-center space-x-3 py-3 hover:bg-teal-500"><i class="fa-solid fa-magnifying-glass"></i><span>ค้นหาสุกร</span></a></li>
            <li><a href="{% url 'home' %}" class="flex items-center space-x-3 py-3 hover:bg-teal-500"><i class="fa-solid fa-right-to-bracket"></i><span>ออกจากระบบ</span></a></li>
        </ul>
    </nav>

    <div class="max-w-xl mx-auto mt-10 p-8 bg-white shadow-lg rounded-3xl border border-gray-300">
        <h1 class="text-4xl font-bold text-gradient-to-r from-pink-500 to-purple-500 text-center mb-6">
            เพิ่มข้อมูลหมู 🐷
        </h1>
        <p class="text-center text-gray-600 mb-8">
            กรุณากรอกข้อมูลที่จำเป็นสำหรับการเพิ่มข้อมูลหมูลงในระบบ
        </p>
        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            <div class="space-y-4">
                {{ form.as_p }}
            </div>
            <!-- Style form inputs -->
            <style>
                input[type="text"], input[type="number"], select, textarea {
                    border: 2px solid #D1D5DB;
                    padding: 0.75rem 1rem;
                    border-radius: 0.5rem;
                    width: 100%;
                    font-size: 1rem;
                    outline: none;
                    transition: border-color 0.3s;
                }
                input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
                    border-color: #3B82F6;
                    box-shadow: 0 0 5px rgba(59, 130, 246, 0.5);
                }
            </style>
            <div class="flex justify-center space-x-4 mt-8">
                <button 
                    type="submit" 
                    class="bg-green-500 text-white font-bold px-6 py-3 rounded-full shadow-lg hover:bg-green-600 hover:shadow-xl transition-all duration-300">
                    บันทึก
                </button>
                <a 
                    href="{% url 'pig_list' %}" 
                    class="bg-red-500 text-white font-bold px-6 py-3 rounded-full shadow-lg hover:bg-red-600 hover:shadow-xl transition-all duration-300">
                    ยกเลิก
                </a>
            </div>
        </form>
    </div>
    

<script>
    document.querySelector('.main-top_button').addEventListener('click', function() {
        document.querySelector('.menu-open').classList.toggle('hidden');
    });

    // JavaScript for handling the search functionality
    const searchInput = document.getElementById('site-search');
    searchInput.addEventListener('input', function() {
        console.log('Searching for:', searchInput.value);
    });
</script>

</body>
</html>
